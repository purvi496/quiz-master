<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Master</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- ==================== START SCREEN ==================== -->

        <div id="start-screen" class="text-center">

            <h1 class="mb-3">Quiz Master</h1>

            <p class="lead">
                Test your knowledge!
            </p>

            <div class="card mx-auto mt-4 p-4 shadow" style="max-width: 500px;">

                <h4 class="mb-3">Choose Difficulty</h4>

                <select id="difficulty" class="form-select mb-3">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>

                <button id="start-btn" class="btn btn-primary w-100">
                    Start Quiz
                </button>

            </div>

        </div>


        <!-- ==================== QUIZ SCREEN ==================== -->

        <div id="quiz-screen" class="d-none">

            <div class="card p-4 shadow mx-auto" style="max-width: 700px;">

                <div class="d-flex justify-content-between mb-3">

                    <span id="question-number">
                        Question 1 of 10
                    </span>

                    <span>
                        Score:
                        <strong id="score">0</strong>
                    </span>

                    <span>
                        Time:
                        <strong id="timer">30</strong>s
                    </span>

                </div>


                <!-- Progress Bar -->

                <div class="progress mb-4">

                    <div
                        id="progress-bar"
                        class="progress-bar"
                        role="progressbar"
                        style="width: 10%;">
                    </div>

                </div>


                <!-- Question -->

                <h3 id="question" class="mb-4">
                    Question goes here
                </h3>


                <!-- Answer Options -->

                <div id="options" class="d-grid gap-2">
                </div>


                <!-- Next Button -->

                <button
                    id="next-btn"
                    class="btn btn-success mt-4"
                    disabled>

                    Next Question

                </button>

            </div>

        </div>


        <!-- ==================== RESULT SCREEN ==================== -->

        <div id="result-screen" class="d-none">

            <div class="card p-4 text-center mx-auto shadow"
                style="max-width: 700px;">

                <h1 class="mb-4">
                    Quiz Completed!
                </h1>


                <!-- Final Score -->

                <h3>
                    Score:
                    <strong id="final-score">
                        0 points
                    </strong>
                </h3>


                <!-- Percentage -->

                <p>
                    Percentage:
                    <strong id="percentage">
                        0%
                    </strong>
                </p>


                <!-- Grade -->

                <p>
                    Grade:
                    <strong id="grade">
                        F
                    </strong>
                </p>


                <!-- Correct Answers -->

                <p>
                    Correct Answers:
                    <strong id="correct-count">
                        0
                    </strong>
                </p>


                <!-- Wrong Answers -->

                <p>
                    Wrong Answers:
                    <strong id="wrong-count">
                        0
                    </strong>
                </p>


                <!-- Speed Bonus -->

                <p>
                    Speed Bonus:
                    <strong id="speed-bonus">
                        0
                    </strong>
                </p>


                <!-- ==================== BUTTONS ==================== -->

                <div class="mt-3">

                    <button
                        id="review-btn"
                        class="btn btn-secondary me-2">

                        Review Answers

                    </button>


                    <button
                        id="restart-btn"
                        class="btn btn-primary">

                        Try Again

                    </button>

                </div>


                <!-- ==================== REVIEW SECTION ==================== -->

                <div
                    id="review-section"
                    class="mt-4 d-none">

                    <h3 class="mb-3">
                        Answer Review
                    </h3>

                    <div id="review-container">
                    </div>

                </div>


                <!-- ==================== QUIZ HISTORY ==================== -->

                <div class="mt-4">

                    <h3 class="mb-3">
                        Quiz History
                    </h3>

                    <div id="history-container">
                    </div>

                </div>


                
            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
